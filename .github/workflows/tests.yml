name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage
        run: python -m pip install coverage
      - name: Demonstration scenario (console)
        run: python roshen_shop.py
      - name: GUI module import (headless smoke)
        run: python -c "import gui"
      - name: Unit, black-box, scenario and GUI-logic tests (33 tests)
        run: python -m unittest discover -s tests -v
      - name: Coverage with branches (must be >= 95%; gui.py omitted via .coveragerc)
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=95
